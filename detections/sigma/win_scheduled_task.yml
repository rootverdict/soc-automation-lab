title: Scheduled Task Created for Persistence
id: 05ea3f58-7c8e-4351-937b-6cd4b87a2bc9
status: experimental
description: >
  Creation of a scheduled task via schtasks.exe or the Task Scheduler,
  a common persistence / privilege mechanism. Sources: Sysmon EID 1
  (schtasks.exe process) and Security EID 4698 (task registered).
references:
  - https://attack.mitre.org/techniques/T1053/005/
author: SOC Automation Lab
date: 2026-07-29
logsource:
  product: windows
  category: process_creation
detection:
  selection_proc:
    Image|endswith: '\schtasks.exe'
    CommandLine|contains: '/create'
  condition: selection_proc
falsepositives:
  - Software installers and legitimate admin automation register scheduled tasks (correlate with change control)
level: medium
tags:
  - attack.persistence
  - attack.privilege-escalation
  - attack.t1053.005
