title: Scheduled Task Registered (Security Log)
id: cd294788-6412-42b0-98b1-1a0831b74440
status: experimental
description: >
  A scheduled task was registered. Security EID 4698 gives the task name and
  author independent of the command line.
references:
  - https://attack.mitre.org/techniques/T1053/005/
author: SOC Automation Lab
date: 2026-07-29
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4698
  condition: selection
falsepositives:
  - Routine software maintenance tasks
level: medium
tags:
  - attack.persistence
  - attack.t1053.005
