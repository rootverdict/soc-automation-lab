name: detections-ci

# Detection-as-code CI: proves the committed rules are syntactically valid, that
# the sample-event test harness is complete and self-consistent, that the
# portable Sigma rules lint, and that no secrets were committed. The authoritative
# rule-FIRING assertion (wazuh-logtest) needs a full Wazuh manager and runs on the
# live host - see tests/README.md. Break a rule's XML/Sigma in a PR and this goes red.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  xml-syntax:
    name: Wazuh rule XML syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install xmllint
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils
      - name: Validate rule files (wrapped in a synthetic root)
        # Wazuh rule files are FRAGMENTS: multiple top-level <group> elements
        # with no single root, so plain xmllint rejects them. Wrap first.
        run: |
          set -e
          for f in detections/local_rules.xml detections/windows/windows_rules.xml; do
            echo "Checking $f"
            { echo '<root>'; cat "$f"; echo '</root>'; } | xmllint --noout -
          done
          echo "All rule files are well-formed XML."

  test-harness:
    name: Sample-event test harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install pyyaml
      - name: Validate harness (cases, samples, runner)
        # The authoritative rule-FIRING assertion needs a full Wazuh manager
        # (wazuh-logtest talks to analysisd over a socket), so it runs on the live
        # host - see tests/README.md. CI proves the harness is complete and
        # self-consistent so it is ready to run there: every case references an
        # existing, non-empty sample and declares exactly one expectation, and the
        # runner compiles.
        run: |
          set -e
          python -c "import ast; ast.parse(open('tests/run_rule_tests.py').read()); print('runner compiles OK')"
          python - <<'PY'
          import os, yaml
          cases = yaml.safe_load(open('tests/cases.yml'))['cases']
          for c in cases:
              assert ('expect_rule' in c) ^ ('expect_no_rule' in c), \
                  f"case '{c['name']}' must declare exactly one of expect_rule / expect_no_rule"
              p = os.path.join('tests', c['file'])
              assert os.path.exists(p), f"missing sample file: {p}"
              assert open(p).read().strip(), f"empty sample file: {p}"
          print(f"{len(cases)} test cases valid; all sample files present and non-empty")
          PY

  sigma-lint:
    name: Sigma rule lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install sigma-cli
        run: pip install sigma-cli
      - name: Lint Sigma rules
        run: sigma check detections/sigma/

  secrets-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        # Use the CLI binary directly, not gitleaks-action@v2 (which has org-
        # license/config friction on push events). Same real history scan.
        run: |
          VERSION=8.18.4
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Scan full history for committed secrets
        run: gitleaks detect --source . --redact --verbose
